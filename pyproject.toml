[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hash-avalanche-analysis"
version = "1.0.0"
description = "Reproducible avalanche-effect experiments for MD5 and SHA-256"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jirapas Wongtreenatrkoon"}]
dependencies = []

[project.scripts]
hash-avalanche = "hash_avalanche.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hash_avalanche*"]
